<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<!-- 렌더러는 네트워크를 직접 쓰지 않는다(모든 요청은 IPC → 메인). connect-src를 막아 강제. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'" />
<title>관심종목</title>
<style>
  /* 색은 전부 아래 변수로만 쓴다. 라이트 테마는 [data-theme="light"] 에서 값만 갈아끼운다.
     차트(Chart.js)는 JS 에서 같은 변수를 읽어간다. */
  :root {
    --bg: rgba(15, 18, 25, 0.86);
    --panel: #0f131a;
    --border: rgba(255, 255, 255, 0.09);
    --line: rgba(255, 255, 255, 0.06);
    --line-2: rgba(255, 255, 255, 0.07);

    --text: #e8ecf2;
    --text-2: #cfd6e2;
    --text-3: #dfe5ee;
    --dim: #8a94a6;
    --mute: #6f7a8c;
    --faint: #5d6675;
    --placeholder: #667187;
    --dname: #97a1b2;

    --hover: rgba(255, 255, 255, 0.045);
    --sel: rgba(255, 255, 255, 0.075);
    --hit-hover: rgba(255, 255, 255, 0.06);
    --btn-hover: rgba(255, 255, 255, 0.1);
    --btn-fg-hover: #fff;
    --field: rgba(255, 255, 255, 0.06);
    --field-border: rgba(255, 255, 255, 0.1);
    --chip: rgba(255, 255, 255, 0.07);
    --chip-2: rgba(255, 255, 255, 0.05);
    --scroll: rgba(255, 255, 255, 0.14);

    --accent: #5b8def;
    --accent-bg: rgba(91, 141, 239, 0.28);
    --accent-fg: #cfe0ff;
    --tf-on-bg: #2f3a4e;
    --tf-on-fg: #fff;

    --dot-off: #4a5261;
    --flat: #9aa4b5;
    --err: #d9714f;
    --del-bg: rgba(226, 75, 74, 0.22);
    --del-fg: #ff9a99;

    --w52-mid: rgba(255, 255, 255, 0.14);
    --w52-mark: #e8ecf2;
    --w52-ring: rgba(0, 0, 0, 0.45);

    /* 차트 */
    --grid: rgba(255, 255, 255, 0.06);
    --avg-line: #9aa4b2; /* 보유 평단가 점선 */
    --prev-line: #7a8494; /* 전일 종가 점선 (1D 차트) */
    --over-line: #4a9ec7; /* 시간외 현재가 점선 — 헤더 시간외 배지와 같은 색 */
    --crosshair: rgba(255, 255, 255, 0.28);
    --tooltip: rgba(10, 13, 18, 0.94);
    /* 이동평균선 9종. 상승 빨강 / 하락 파랑과 겹치지 않게 고른다. */
    --ma-5: #f2b544;
    --ma-10: #e8823c;
    --ma-20: #6f8fd6;
    --ma-40: #57b6a6;
    --ma-60: #9b7fd4;
    --ma-80: #d3739f;
    --ma-120: #8fb63f;
    --ma-240: #4aa3c7;
    --ma-360: #b0b8c4;

    /* 마우스가 벗어났을 때의 불투명도. 설정에서 조절하며 JS가 덮어쓴다. */
    --idle-opacity: 0.74;
  }

  [data-theme="light"] {
    --bg: rgba(250, 251, 252, 0.92);
    --panel: #f4f6f8;
    --border: rgba(0, 0, 0, 0.14);
    --line: rgba(0, 0, 0, 0.08);
    --line-2: rgba(0, 0, 0, 0.10);

    --text: #1a1f27;
    --text-2: #2c3440;
    --text-3: #11151b;
    --dim: #5b6472;
    --mute: #79828f;
    --faint: #9aa2ad;
    --placeholder: #a3abb6;
    --dname: #5b6472;

    --hover: rgba(0, 0, 0, 0.04);
    --sel: rgba(0, 0, 0, 0.06);
    --hit-hover: rgba(0, 0, 0, 0.05);
    --btn-hover: rgba(0, 0, 0, 0.08);
    --btn-fg-hover: #11151b;
    --field: rgba(0, 0, 0, 0.04);
    --field-border: rgba(0, 0, 0, 0.14);
    --chip: rgba(0, 0, 0, 0.06);
    --chip-2: rgba(0, 0, 0, 0.05);
    --scroll: rgba(0, 0, 0, 0.18);

    --accent: #2f6fe0;
    --accent-bg: rgba(47, 111, 224, 0.18);
    --accent-fg: #1c4fa8;
    --tf-on-bg: #d7dee9;
    --tf-on-fg: #1a1f27;

    --dot-off: #c2c8d0;
    --flat: #6b7480;
    --err: #c0392b;
    --del-bg: rgba(226, 75, 74, 0.16);
    --del-fg: #c0272d;

    --w52-mid: rgba(0, 0, 0, 0.12);
    --w52-mark: #1a1f27;
    --w52-ring: rgba(255, 255, 255, 0.85);

    --grid: rgba(0, 0, 0, 0.08);
    --avg-line: #6b7480; /* 보유 평단가 점선 */
    --prev-line: #8b93a0; /* 전일 종가 점선 (1D 차트) */
    --over-line: #2d7fa6; /* 시간외 현재가 점선 — 헤더 시간외 배지와 같은 색 */
    --crosshair: rgba(0, 0, 0, 0.3);
    --tooltip: rgba(255, 255, 255, 0.96);
    --ma-5: #b8811f;
    --ma-10: #c2601a;
    --ma-20: #3f63b0;
    --ma-40: #2c8377;
    --ma-60: #6f4fae;
    --ma-80: #a8407a;
    --ma-120: #5f8016;
    --ma-240: #1f7397;
    --ma-360: #6b7480;
  }

  /* 반투명 위젯. 창 자체는 transparent라 .widget이 실제 배경. */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: transparent;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
    color: var(--text); user-select: none; -webkit-font-smoothing: antialiased;
  }

  /* 마우스 올리면 진해지고, 벗어나면 옅어진다 */
  .widget {
    height: 100%; display: flex; flex-direction: column; position: relative;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    opacity: var(--idle-opacity); transition: opacity 0.18s ease;
    will-change: opacity; /* 별도 합성 레이어로 올려 재합성 범위를 줄인다 */
  }
  .widget:hover { opacity: 1; }
  /* 투명도를 조절하는 동안에는 마우스가 위젯 위에 있어 hover 로 불투명해진다.
     그러면 조절 효과가 안 보이므로, 슬라이더를 만지는 중에만 hover 를 무시한다. */
  .widget.preview:hover { opacity: var(--idle-opacity); }

  /* --- 상단 바 --- */
  .bar {
    display: flex; align-items: center;
    padding: 7px 8px 7px 11px; flex: 0 0 auto;
    border-bottom: 1px solid var(--line);
  }
  /* 창 이동은 이 영역에서만. 버튼은 이 밖에 있으므로 no-drag 중첩이 없다. */
  .draghandle {
    -webkit-app-region: drag;
    flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; gap: 8px;
  }
  .btns { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding-left: 8px; }
  .bar .title { font-size: 12px; font-weight: 700; letter-spacing: .2px; }
  .bar .updated {
    margin-left: auto; font-size: 10px; color: var(--mute);
    font-variant-numeric: tabular-nums; /* 초가 바뀔 때 폭이 흔들리지 않게 */
    overflow: hidden; white-space: nowrap;
  }
  .bar .updated .live { color: #2fa15a; font-weight: 700; }
  .bar .updated .delay { color: #e8862a; font-weight: 700; }
  .bar .updated .over { color: #4a9ec7; font-weight: 700; } /* 시간외 */
  .bar .updated .closed { color: var(--dim); font-weight: 700; }
  .bar button {
    width: 20px; height: 20px; padding: 0; flex: 0 0 auto;
    background: transparent; border: 0; border-radius: 5px;
    color: var(--dim); font-size: 13px; line-height: 1; cursor: pointer;
  }
  .bar button:hover { background: var(--btn-hover); color: var(--btn-fg-hover); }
  .bar button.on { background: var(--accent-bg); color: var(--accent-fg); }

  /* 접힌 상태: 차트·상세를 숨기고 관심종목 목록만 남긴다 */
  .widget.compact .detail { display: none; }
  .widget.compact #list { min-height: 0; }

  /* --- 코스피/코스닥 지수 --- */
  .indices {
    flex: 0 0 auto; display: flex; gap: 12px; padding: 5px 11px;
    font-size: 10px; border-bottom: 1px solid var(--line);
  }
  .indices[hidden] { display: none; }
  .indices .ix { display: flex; gap: 4px; align-items: baseline; }
  .indices .ixn { color: var(--mute); }
  .indices .ixv { color: var(--text-2); font-variant-numeric: tabular-nums; }
  .indices .ixp { font-variant-numeric: tabular-nums; }

  /* 보유 종목 전체 합계. 보유가 하나도 없으면 줄 자체가 사라진다. */
  .folio {
    flex: 0 0 auto; display: flex; gap: 6px; align-items: baseline; padding: 5px 11px;
    font-size: 10px; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .folio[hidden] { display: none; }
  .folio .fn { color: var(--mute); }
  .folio .fv { color: var(--text-2); }
  .folio .fp { margin-left: auto; font-weight: 700; }
  .folio .fx { color: var(--faint); font-size: 9px; }

  /* --- 본문 (리스트 + 상세, 검색 오버레이의 기준) --- */
  .body { flex: 1 1 auto; display: flex; flex-direction: column; position: relative; min-height: 0; }

  /* --- 관심종목 리스트 --- */
  #list { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  #list::-webkit-scrollbar { width: 5px; }
  #list::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }

  .row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 11px; cursor: pointer; border-left: 2px solid transparent;
  }
  .row:hover { background: var(--hover); }
  .row.on { background: var(--sel); border-left-color: var(--accent); }
  .row .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--dot-off); }
  /* 순서 변경 드래그 */
  .row.dragging { opacity: .35; }
  .row.dropto { box-shadow: inset 0 2px 0 var(--accent); }
  .row .name { font-size: 12px; flex: 1 1 auto; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row .px { font-size: 12px; font-variant-numeric: tabular-nums; }
  .row .chg { font-size: 10px; width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  /* 삭제 버튼은 자리를 항상 차지하되 hover에서만 보인다 (행 폭이 흔들리지 않게) */
  .row .del {
    width: 15px; height: 15px; flex: 0 0 auto; padding: 0;
    background: transparent; border: 0; border-radius: 4px;
    color: var(--mute); font-size: 11px; line-height: 1; cursor: pointer;
    opacity: 0; transition: opacity .12s;
  }
  .row:hover .del { opacity: 1; }
  .row .del:hover { background: var(--del-bg); color: var(--del-fg); }

  .empty { padding: 22px 12px; text-align: center; font-size: 11px; color: var(--mute); line-height: 1.7; }

  /* --- 검색 오버레이 --- */
  /* 아래 목록/차트가 비쳐 읽기 어려우므로 불투명. 창 전체 반투명은 .widget 쪽에서 처리된다 */
  /* 삭제 되돌리기 줄. 레이아웃을 밀지 않도록 창 바닥에 겹쳐 띄운다
     (접힌 상태에서 목록 높이가 줄어드는 걸 막는다). */
  .undo {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 8;
    display: flex; align-items: center; gap: 8px; padding: 7px 11px;
    font-size: 10px; color: var(--text-2);
    background: var(--tooltip); border-top: 1px solid var(--border);
  }
  .undo[hidden] { display: none; }
  .undo button {
    margin-left: auto; flex: 0 0 auto;
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: inherit; font-size: 10px; font-weight: 700; color: var(--accent);
  }
  .undo button:hover { text-decoration: underline; }

  .search { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
            background: var(--panel); }
  .search[hidden] { display: none; }
  .qbar { display: flex; gap: 6px; padding: 9px 10px; border-bottom: 1px solid var(--line-2); }
  .qbar input {
    flex: 1 1 auto; min-width: 0; user-select: text;
    background: var(--hit-hover); border: 1px solid var(--field-border);
    border-radius: 6px; padding: 6px 8px; color: var(--text); font-size: 12px;
    font-family: inherit; outline: none;
  }
  .qbar input:focus { border-color: var(--accent); }
  .qbar input::placeholder { color: var(--placeholder); }
  .qbar button {
    width: 24px; flex: 0 0 auto; background: transparent; border: 0; border-radius: 5px;
    color: var(--dim); font-size: 12px; cursor: pointer;
  }
  .qbar button:hover { background: var(--field-border); color: var(--btn-fg-hover); }

  #results { flex: 1 1 auto; overflow-y: auto; }
  #results::-webkit-scrollbar { width: 5px; }
  #results::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }
  .hit { display: flex; align-items: center; gap: 8px; padding: 7px 11px; cursor: pointer; }
  .hit:hover { background: var(--hit-hover); }
  .hit .hname { flex: 1 1 auto; font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .hit .hmeta { font-size: 10px; color: var(--mute); flex: 0 0 auto; }
  .hit.dup { cursor: default; opacity: .45; }
  .hit.dup:hover { background: transparent; }
  .qhint { padding: 8px 11px; font-size: 10px; color: var(--mute); }

  /* --- 설정 패널 (목표가 알림 · 보유) --- */
  .ptitle { flex: 1 1 auto; font-size: 12px; font-weight: 700; align-self: center; }
  .sect {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 11px 5px; font-size: 10px; font-weight: 700; color: var(--dim);
  }
  .sect .sechint { font-weight: 400; color: var(--faint); }
  .toggle { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 400; cursor: pointer; }
  /* 다크 / 라이트 선택 */
  .seg { margin-left: auto; display: flex; gap: 3px; }
  .seg button {
    background: var(--chip-2); border: 0; border-radius: 5px;
    color: var(--dim); font-size: 10px; font-weight: 400;
    padding: 3px 9px; cursor: pointer; font-family: inherit;
  }
  .seg button:hover { color: var(--text-3); }
  .seg button.on { background: var(--tf-on-bg); color: var(--tf-on-fg); font-weight: 700; }

  /* 투명도 슬라이더 */
  .orow { display: flex; align-items: center; gap: 8px; padding: 2px 11px 0; }
  .orow .olabel { font-size: 10px; color: var(--dim); flex: 0 0 auto; }
  .orow .oval {
    font-size: 10px; color: var(--text-2); flex: 0 0 auto;
    width: 30px; text-align: right; font-variant-numeric: tabular-nums;
  }
  .orow input[type="range"] {
    flex: 1 1 auto; min-width: 0; height: 16px; margin: 0;
    accent-color: var(--accent); cursor: pointer;
  }
  .ohint { padding: 3px 11px 0; font-size: 9px; color: var(--faint); line-height: 1.5; }

  /* 이동평균 기간 선택. 켜진 칩은 해당 선의 색을 그대로 띤다. */
  .machips { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 11px 0; }
  .machips button {
    background: var(--chip-2); border: 1px solid transparent; border-radius: 5px;
    color: var(--dim); font-size: 10px; padding: 3px 7px; cursor: pointer;
    font-family: inherit; font-variant-numeric: tabular-nums;
  }
  .machips button:hover { color: var(--text-3); }
  .machips button.on { font-weight: 700; }
  /* 지금 타임프레임 구간에 비해 너무 긴 기간 — 켜져 있어도 그려지지 않는다 */
  .machips button.off { opacity: .32; }
  .toggle input { accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; }
  #alertList { flex: 1 1 auto; overflow-y: auto; }
  #alertList::-webkit-scrollbar { width: 5px; }
  #alertList::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }
  .arow { display: flex; align-items: center; gap: 5px; padding: 5px 11px; }
  .arow .aname { flex: 1 1 auto; font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .arow input {
    width: 68px; flex: 0 0 auto; user-select: text;
    background: var(--hit-hover); border: 1px solid var(--field-border);
    border-radius: 5px; padding: 3px 5px; color: var(--text); font-size: 10px;
    font-family: inherit; outline: none; text-align: right;
  }
  .arow input:focus { border-color: var(--accent); }
  .arow input::placeholder { color: var(--faint); }
  .arow input.up:focus { border-color: #e24b4a; }
  .arow input.dn:focus { border-color: #185fa5; }
  /* 알림이 꺼져 있으면 입력은 되지만 동작하지 않음을 시각적으로 알린다 */
  #alerts.off #alertRows { opacity: .45; }

  /* 상세의 보유/평가손익 줄 */
  .hold { display: flex; align-items: baseline; gap: 6px; margin-top: 7px; font-size: 10px; color: var(--dim); }
  .hold[hidden] { display: none; }
  .hold .hpl { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; }
  .hold .hqty { font-variant-numeric: tabular-nums; color: var(--text-2); }

  /* --- 하단 상세 + 차트 --- */
  .detail { flex: 0 0 auto; border-top: 1px solid var(--line-2); padding: 9px 11px 10px; }
  .dhead { display: flex; align-items: flex-end; gap: 8px; }
  .dname { font-size: 11px; color: var(--dname); }
  .dprice { font-size: 19px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .dchg { margin-left: auto; font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }

  /* 타임프레임이 5개라 좁은 폭에서는 넘칠 수 있다. 넘치면 다음 줄로 내려보낸다. */
  .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; row-gap: 5px; margin-top: 7px; }

  /* 이동평균선 범례 — 기간 숫자 뒤에 그 선의 색 */
  .malegend { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; row-gap: 3px; margin-top: 6px; }
  .malegend span {
    display: inline-flex; align-items: center; gap: 2px;
    font-size: 9px; color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .malegend i { width: 7px; height: 7px; border-radius: 2px; }
  /* 차트에 마우스를 올렸을 때 들어가는 값. 비어 있어도 폭을 유지해 줄바꿈이 흔들리지 않게 한다. */
  .malegend b { min-width: 42px; text-align: right; font-weight: 400; color: var(--text-3); }
  .badge {
    font-size: 10px; font-weight: 700; padding: 2.5px 7px; border-radius: 999px;
    background: var(--chip); color: var(--flat); white-space: nowrap;
  }
  .badge.period { font-variant-numeric: tabular-nums; }
  /* 골든크로스는 상승 계열(빨강), 데드크로스는 하락 계열(파랑) — 한국 관례 */
  .badge.cross { font-variant-numeric: tabular-nums; }
  .badge.cross.up { background: rgba(226, 75, 74, .16); color: #e24b4a; }
  .badge.cross.down { background: rgba(24, 95, 165, .18); color: #4d8fd6; }
  [data-theme="light"] .badge.cross.down { color: #185fa5; }
  .badge[hidden] { display: none; }
  .tf { margin-left: auto; display: flex; gap: 3px; }
  .tf button {
    background: var(--chip-2); border: 0; border-radius: 5px;
    color: var(--dim); font-size: 10px; padding: 3px 6px; cursor: pointer;
  }
  .tf button:hover { color: var(--text-3); }
  .tf button.on { background: var(--tf-on-bg); color: var(--tf-on-fg); }

  /* 52주 저점~고점 막대. 현재가 위치를 점으로 표시 */
  .w52 { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 9px; color: var(--mute); }
  .w52[hidden] { display: none; }
  .w52 .w52v { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .w52 .w52bar {
    flex: 1 1 auto; position: relative; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(24,95,165,.55), var(--scroll), rgba(226,75,74,.55));
  }
  .w52 .w52bar i {
    position: absolute; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
    border-radius: 50%; background: var(--w52-mark); box-shadow: 0 0 0 1.5px var(--w52-ring);
  }

  /* 창을 세로로 늘리면 차트도 같이 커진다. 최소 150px(기본 창 높이일 때의 크기)는
     지키고, 300px 를 넘어 관심종목 목록을 다 밀어내지는 않게 한다. */
  .chartbox { height: clamp(150px, 26vh, 300px); margin-top: 7px; position: relative; }
  .err { margin-top: 5px; font-size: 10px; color: var(--err); min-height: 12px; }
</style>
</head>
<body>
  <div class="widget">
    <div class="bar">
      <!-- 드래그 영역과 버튼을 형제로 분리한다.
           버튼을 드래그 영역 "안"에 no-drag 로 박아두면 커서가 경계를 넘을 때마다
           Windows 가 히트테스트를 다시 하면서 투명 창이 재합성돼 깜빡인다. -->
      <span class="draghandle">
        <span class="title">관심종목</span>
        <span class="updated" id="updated">불러오는 중…</span>
      </span>
      <span class="btns">
        <button id="add" title="종목 추가">＋</button>
        <button id="bell" title="설정 (화면 · 알림 · 보유)">⚙</button>
        <button id="dock" title="우하단으로 접기">◲</button>
        <button id="min" title="최소화">─</button>
        <button id="close" title="닫기">✕</button>
      </span>
    </div>

    <div class="indices" id="indices" hidden></div>

    <!-- 보유 종목 전체 평가금액·손익 -->
    <div class="folio" id="folio" hidden></div>

    <div class="body">
    <div id="list"></div>

    <div class="detail">
      <div class="dhead">
        <div>
          <div class="dname" id="dname">—</div>
          <div class="dprice" id="dprice">—</div>
        </div>
        <div class="dchg" id="dchg"></div>
      </div>

      <div class="meta">
        <span class="badge" id="badge">RSI —</span>
        <span class="badge period" id="period" hidden></span>
        <!-- 가장 최근 골든/데드크로스 -->
        <span class="badge cross" id="cross" hidden></span>
        <div class="tf" id="tf"></div>
      </div>

      <!-- 이동평균선 범례. 차트 안에 넣으면 높이를 잡아먹어 밖으로 뺐다. -->
      <div class="malegend" id="maLegend" hidden></div>

      <!-- 보유 수량 · 평가손익 (설정에서 입력한 경우에만) -->
      <div class="hold" id="hold" hidden></div>

      <!-- 52주 최저~최고 구간에서 현재가의 위치 -->
      <div class="w52" id="w52" hidden>
        <span class="w52v" id="w52lo"></span>
        <span class="w52bar"><i id="w52mark"></i></span>
        <span class="w52v" id="w52hi"></span>
      </div>

      <div class="chartbox"><canvas id="chart"></canvas></div>
      <div class="err" id="err"></div>
    </div>

    <!-- 종목 검색 오버레이 -->
    <div class="search" id="search" hidden>
      <div class="qbar">
        <input id="q" type="text" spellcheck="false" placeholder="종목명 또는 코드 (예: 삼성전자, 005930)" />
        <button id="qclose" title="닫기(Esc)">✕</button>
      </div>
      <div id="results"></div>
      <div class="qhint" id="qhint">종목명을 입력하세요</div>
    </div>

    <!-- 목표가 알림 · 보유 설정 오버레이 -->
    <div class="search" id="alerts" hidden>
      <div class="qbar">
        <span class="ptitle">설정</span>
        <button id="alertClose" title="닫기(Esc)">✕</button>
      </div>
      <div id="alertList">
        <div class="sect">
          화면
          <span class="seg" id="themeSeg">
            <button type="button" data-theme="dark">다크</button>
            <button type="button" data-theme="light">라이트</button>
          </span>
        </div>
        <div class="orow">
          <span class="olabel">투명도</span>
          <input type="range" id="opacity" min="30" max="100" step="5" />
          <span class="oval" id="opacityVal">74%</span>
        </div>
        <div class="ohint">마우스를 올리면 항상 또렷해집니다. 위 값은 벗어났을 때의 진하기입니다.</div>

        <div class="sect">이동평균선 <span class="sechint">일봉 차트(1M · 3M · 1Y)에만 표시</span></div>
        <div class="machips" id="maChips"></div>
        <div class="ohint">흐린 기간은 지금 보고 있는 구간에 비해 너무 길어 그리지 않습니다. 더 긴 타임프레임으로 바꾸면 나타납니다.</div>
        <div class="sect">
          목표가 알림
          <label class="toggle"><input type="checkbox" id="alertOn" /> 사용</label>
        </div>
        <div id="alertRows"></div>
        <div class="sect">보유 종목 <span class="sechint">수량 · 평단가</span></div>
        <div id="holdRows"></div>
      </div>
      <div class="qhint" id="alertHint"></div>
    </div>
    </div>

    <!-- 삭제 되돌리기. 잠깐 떠 있다가 사라진다. -->
    <div class="undo" id="undo" hidden>
      <span id="undoText"></span>
      <button type="button" id="undoBtn">되돌리기</button>
    </div>
  </div>

  <script src="./node_modules/chart.js/dist/chart.umd.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
