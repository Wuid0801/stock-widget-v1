# 데이터 출처 점검 — 앱이 쓰는 비공식 시세 주소(네이버 · 야후 · FRED · WiseReport)가 지금도 같은 모양으로 오는지 매주 본다.
#
# tests/sources-live.mjs 가 main.js 의 받기 · 해석 코드를 진짜 네트워크로 돌린다. 주소가 막히거나 응답 모양이 바뀌면
# 그 항목이 FAIL 이고 이 작업이 실패해 GitHub 이 실패 알림(메일)을 보낸다 — 앱을 쓰다가 이상한 것을 보기 전에 안다.
# 앱 코드가 아니라 바깥이 바뀌는 것이라 푸시마다 돌리지 않는다(test.yml 은 고정 데이터로 돈다). 손으로는 Actions 탭의
# Run workflow 나 로컬에서 `npm run check:sources`.
name: sources

on:
  schedule:
    # 매주 화요일 01:00 UTC = 10:00 KST — 국내 장중이라 분봉 · 실시간 항목이 비지 않는다(월요일 아침은 지난주 데이터가 섞인다)
    - cron: '0 1 * * 2'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # node_modules 없이 돈다 — electron · electron-store 는 가짜로 끼운다(tests/sources-live.mjs loadHandlers)
      - name: 출처 점검
        run: node tests/sources-live.mjs
